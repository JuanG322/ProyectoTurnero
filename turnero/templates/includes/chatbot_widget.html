<!-- ══════════════════════════════════════════
     CHATBOT — Botón flotante + Ventana de chat
     ══════════════════════════════════════════ -->
<div id="chatbot-root" class="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3">

    <!-- Ventana de chat (oculta por defecto) -->
    <div id="chat-window" class="hidden flex-col w-80 sm:w-96 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700
                rounded-2xl shadow-2xl overflow-hidden transition-all duration-300" style="max-height: 520px;">

        <!-- Encabezado -->
        <div class="flex items-center justify-between px-4 py-3 bg-[#0960ae] dark:bg-[#07508f]">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-white text-xl">smart_toy</span>
                <div>
                    <p class="text-white text-sm font-semibold leading-tight">Asistente Turnero</p>
                    <p class="text-blue-200 text-xs leading-tight">¿En qué te puedo ayudar?</p>
                </div>
            </div>
            <button id="chat-close-btn"
                class="text-white/80 hover:text-white transition-colors p-1 rounded-full hover:bg-white/20"
                aria-label="Cerrar chat">
                <span class="material-symbols-outlined text-xl">close</span>
            </button>
        </div>

        <!-- Área de mensajes -->
        <div id="chat-messages" class="flex-1 overflow-y-auto px-4 py-3 space-y-3 bg-gray-50 dark:bg-gray-900"
            style="height: 320px;">
            <!-- Mensaje de bienvenida -->
            <div class="flex items-start gap-2">
                <div class="w-7 h-7 rounded-full bg-[#0960ae] flex items-center justify-center shrink-0 mt-0.5">
                    <span class="material-symbols-outlined text-white text-sm">smart_toy</span>
                </div>
                <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700
                            rounded-2xl rounded-tl-none px-3 py-2 max-w-[75%] shadow-sm">
                    <p class="text-sm text-gray-700 dark:text-gray-200 leading-relaxed">
                        ¡Hola! Soy el asistente de <strong>Turnero</strong>. Cuéntame qué necesitas y te indico a qué
                        sección ir. 😊
                    </p>
                </div>
            </div>
        </div>

        <!-- Indicador de "escribiendo..." (oculto por defecto) -->
        <div id="typing-indicator" class="hidden px-4 py-2 bg-gray-50 dark:bg-gray-900">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-full bg-[#0960ae] flex items-center justify-center shrink-0">
                    <span class="material-symbols-outlined text-white text-sm">smart_toy</span>
                </div>
                <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700
                            rounded-2xl rounded-tl-none px-3 py-2 flex items-center gap-1 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-gray-400 dark:bg-gray-500 animate-bounce"
                        style="animation-delay: 0ms;"></span>
                    <span class="w-2 h-2 rounded-full bg-gray-400 dark:bg-gray-500 animate-bounce"
                        style="animation-delay: 150ms;"></span>
                    <span class="w-2 h-2 rounded-full bg-gray-400 dark:bg-gray-500 animate-bounce"
                        style="animation-delay: 300ms;"></span>
                </div>
            </div>
        </div>

        <!-- Campo de entrada -->
        <div
            class="px-3 py-3 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 flex items-center gap-2">
            <input id="chat-input" type="text" placeholder="Escribe tu pregunta..." maxlength="300" autocomplete="off"
                class="flex-1 text-sm bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200
                          placeholder-gray-400 rounded-full px-4 py-2 outline-none
                          focus:ring-2 focus:ring-[#0960ae] dark:focus:ring-[#007dbf]
                          border border-transparent dark:border-gray-700 transition-all" />
            <button id="chat-send-btn" class="w-9 h-9 rounded-full bg-[#0960ae] hover:bg-[#007dbf] flex items-center justify-center
                           transition-colors shadow-md disabled:opacity-50 disabled:cursor-not-allowed shrink-0"
                aria-label="Enviar mensaje">
                <span class="material-symbols-outlined text-white text-lg">send</span>
            </button>
        </div>
    </div>

    <!-- Botón flotante de apertura -->
    <button id="chat-toggle-btn" class="w-14 h-14 rounded-full bg-[#0960ae] hover:bg-[#007dbf] text-white shadow-xl
                   flex items-center justify-center transition-all duration-200 hover:scale-110 active:scale-95"
        aria-label="Abrir asistente virtual">
        <span id="chat-toggle-icon" class="material-symbols-outlined text-2xl">chat</span>
    </button>
</div>

<!-- ══════════════════════════════════════════
     CHATBOT — JavaScript
     ══════════════════════════════════════════ -->
<script>
    (function () {
        'use strict';

        // ── Referencias DOM ────────────────────────────────────────────────────
        const chatWindow = document.getElementById('chat-window');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('chat-send-btn');
        const toggleBtn = document.getElementById('chat-toggle-btn');
        const toggleIcon = document.getElementById('chat-toggle-icon');
        const closeBtn = document.getElementById('chat-close-btn');
        const typingEl = document.getElementById('typing-indicator');

        // ── CSRF helper ────────────────────────────────────────────────────────
        function getCsrfToken() {
            const meta = document.querySelector('meta[name="csrf-token"]');
            if (meta) return meta.getAttribute('content');
            // Django cookie fallback
            const match = document.cookie.match(/csrftoken=([^;]+)/);
            return match ? match[1] : '';
        }

        // ── Abrir / cerrar ventana ─────────────────────────────────────────────
        function openChat() {
            chatWindow.classList.remove('hidden');
            chatWindow.classList.add('flex');
            toggleIcon.innerText = 'close';
            toggleBtn.classList.add('bg-gray-600', 'hover:bg-gray-700');
            toggleBtn.classList.remove('bg-[#0960ae]', 'hover:bg-[#007dbf]');
            chatInput.focus();
            scrollToBottom();
        }

        function closeChat() {
            chatWindow.classList.add('hidden');
            chatWindow.classList.remove('flex');
            toggleIcon.innerText = 'chat';
            toggleBtn.classList.remove('bg-gray-600', 'hover:bg-gray-700');
            toggleBtn.classList.add('bg-[#0960ae]', 'hover:bg-[#007dbf]');
        }

        toggleBtn.addEventListener('click', () => {
            chatWindow.classList.contains('hidden') ? openChat() : closeChat();
        });
        closeBtn.addEventListener('click', closeChat);

        // ── Utilidades de mensajes ─────────────────────────────────────────────
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendMessage(role, text) {
            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = 'flex items-start gap-2' + (isUser ? ' justify-end' : '');

            if (!isUser) {
                const avatar = document.createElement('div');
                avatar.className = 'w-7 h-7 rounded-full bg-[#0960ae] flex items-center justify-center shrink-0 mt-0.5';
                avatar.innerHTML = '<span class="material-symbols-outlined text-white text-sm">smart_toy</span>';
                wrapper.appendChild(avatar);
            }

            const bubble = document.createElement('div');
            bubble.className = isUser
                ? 'bg-[#0960ae] text-white rounded-2xl rounded-tr-none px-3 py-2 max-w-[75%] shadow-sm'
                : 'bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl rounded-tl-none px-3 py-2 max-w-[75%] shadow-sm';

            const p = document.createElement('p');
            p.className = 'text-sm leading-relaxed' + (isUser ? ' text-white' : ' text-gray-700 dark:text-gray-200');
            p.textContent = text;
            bubble.appendChild(p);
            wrapper.appendChild(bubble);
            chatMessages.appendChild(wrapper);
            scrollToBottom();
        }

        function setLoading(loading) {
            chatInput.disabled = loading;
            sendBtn.disabled = loading;
            typingEl.classList.toggle('hidden', !loading);
            if (loading) scrollToBottom();
        }

        // ── Enviar mensaje al backend ──────────────────────────────────────────
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            chatInput.value = '';
            appendMessage('user', text);
            setLoading(true);

            try {
                const response = await fetch("{% url 'chatbot_api' %}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken(),
                    },
                    body: JSON.stringify({ mensaje: text }),
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                appendMessage('bot', data.respuesta || 'En este momento no puedo responder. Intenta más tarde.');
            } catch (err) {
                console.error('Chatbot error:', err);
                appendMessage('bot', 'En este momento no puedo responder. Por favor, intenta más tarde.');
            } finally {
                setLoading(false);
                chatInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    })();
</script>
